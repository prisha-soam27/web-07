<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid layout</title>
    <style> 
        *,html{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color :azure;
        }
        main{
            width: 960px;
            height: auto;
            background-color: white;
            margin: 0 auto;
            display: grid;
            grid-template-rows: 100px 80px 400px 300px;
            grid-template-columns: 1;
            gap: 10px;
            text-align: center;
        }
        main div{
            background-color: lightgrey;
            /* align-content: center; */
        }
        #section{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr;
            gap: 10px;
        }
        #section div{
            background-color: white;
        }
    </style>
</head>
<body>
    <main>  
        <div><h2>header</h2></div>
        <div><h2>navbar</h2></div> 
        <!-- section -->
        <div id="section">
            <div>box 1</div>
            <div>box 2</div>
            <div>box 3</div>
        </div>
        <!-- section end -->
        <div><h2>footer</h2></div>
    </main>
    
</body>
</html>
