<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT REGISTRATION FORM</title>
    <style> 
        *html {
            margin: 0;
            padding: 0;
        }
        #box{
            width: 600px;
            height: 900px;
            background-color: lightcyan;
            margin: 0px auto;
            padding: 10px 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="box">
        <form>
            <div>
                <label>YOUR NAME : </label>
                <input type="text" placeholder="Enter your name"/>
            </div>
            <div>
                <label>YOUR EMAIL : </label>
                <input type="email" placeholder="Enter your email"/>
            </div>
            <div>
                <label>YOUR CONTACT: </label>
                <input type="tel" placeholder="Enter your contact number"/>
            </div>
            <div>
                <label>YOUR DOB : </label>
                <input type="date" placeholder="Enter your dob"/>
            </div>
            <div> 
                <label>YOUR GENDER : </label>
                <input type="radio" name="gender" value="male" placeholder="Male"/>  
                <input type="radio" name="gender" value="female" placeholder="Female"/>
                <input type="radio" name="gender" value="other" placeholder="Other"/>
            </div>
            
        </form> </div>
    
</body>
</html>
